<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Contact - Akela Toolbox</title>
  <meta name="description" content="Contactez Akela Toolbox pour proposer un jeu, signaler un bug ou rejoindre le projet Louveteaux.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#39ff14">
  <link rel="canonical" href="https://josephhumbert.github.io/AkelaToolbox/contact.html" />
  <meta property="og:title" content="Contact - Akela Toolbox" />
  <meta property="og:description" content="Échangez avec l'équipe Akela Toolbox et contribuez à la communauté Louveteaux." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://josephhumbert.github.io/AkelaToolbox/contact.html" />
  <meta property="og:image" content="https://josephhumbert.github.io/AkelaToolbox/assets/social-card.svg" />
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Contact - Akela Toolbox">
  <meta name="twitter:description" content="Échangez avec l'équipe Akela Toolbox et contribuez à la communauté Louveteaux.">
  <meta name="twitter:image" content="https://josephhumbert.github.io/AkelaToolbox/assets/social-card.svg">
  <link rel="stylesheet" href="https://josephhumbert.github.io/AkelaToolbox/style.css">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ContactPage",
      "name": "Contact Akela Toolbox",
      "url": "https://josephhumbert.github.io/AkelaToolbox/contact.html",
      "description": "Formulaire de contact pour les chefs Louveteaux et contributeurs Akela Toolbox."
    }
  </script>
</head>

<body>

  <h1>🐺 Akela Toolbox</h1>

  <!-- navbar -->
  <div id="navbar"></div>
  <noscript>
    <nav>
      <a href="index.html" class="nav-link">🏠 Accueil</a>
      <a href="liste-jeux.html" class="nav-link">📚 Liste jeux</a>
      <a href="generateur.html" class="nav-link">🛠 AkelaAI</a>
      <a href="nouveau-jeu.html" class="nav-link">➕ Nouveau jeu</a>
      <a href="contact.html" class="nav-link">📬 Contact</a>
    </nav>
  </noscript>
  <script>
    fetch('https://josephhumbert.github.io/AkelaToolbox/includes/navbar.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('navbar').innerHTML = html;
      })
      .catch(() => {
        const fallback = document.querySelector('noscript nav');
        if (fallback) {
          document.getElementById('navbar').innerHTML = fallback.outerHTML;
        }
      });
  </script>

  <!-- Section Contact -->
  <section id="contact" class="active">
    <h2>📬 Formulaire de contact</h2>

    <form id="contact-form">
      <label for="nom">Nom</label>
      <input type="text" name="nom" id="nom" required />

      <label for="email">Email</label>
      <input type="email" name="email" id="email" required />

      <label for="objet">Objet</label>
      <input type="text" name="objet" id="objet" required />

      <label for="message">Message</label>
      <textarea name="message" id="message" rows="6" required></textarea>

      <button type="submit" id="submit-btn">Envoyer</button>
    </form>

    <div id="feedback">💬 Saisissez votre message.</div>
  </section>

  <!-- footer -->
  <div id="footer"></div>
  <script>
    fetch("https://josephhumbert.github.io/AkelaToolbox/includes/footer.html")
      .then(res => res.text())
      .then(html => document.getElementById("footer").innerHTML = html);
  </script>

  <!-- Script de validation et d'envoi -->
  <script>
    const form = document.getElementById('contact-form');
    const feedback = document.getElementById('feedback');
    const submitBtn = document.getElementById('submit-btn');

    const temporaryEmailDomains = [
      'mailinator.com', '10minutemail.com', 'guerrillamail.com', 'yopmail.com',
      'trashmail.com', 'temp-mail.org', 'getnada.com', 'tempmail.lol',
      'sharklasers.com', 'fakeinbox.com', 'mintemail.com', 'maildrop.cc'
    ];

    function isTemporaryEmail(email) {
      const domain = email.split('@')[1].toLowerCase();
      return temporaryEmailDomains.includes(domain);
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      feedback.textContent = '';

      const email = form.email.value.trim();
      if (!email || !email.includes('@') || isTemporaryEmail(email)) {
        feedback.textContent = "❌ Adresse email invalide ou temporaire.";
        return;
      }

      const data = {
        data: {
          nom: form.nom.value,
          email: email,
          objet: form.objet.value,
          message: form.message.value,
        }
      };

      feedback.textContent = "⏳ Envoi en cours...";
      submitBtn.disabled = true;

      fetch('https://sheetdb.io/api/v1/7v0p7hj8agkcm', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(data)
      })
      .then(response => {
        if (response.ok) {
          feedback.textContent = "✅ Message envoyé avec succès ! Merci pour ton contact 🐾";
          form.reset();
        } else {
          feedback.textContent = "❌ Erreur lors de l'envoi du message.";
        }
      })
      .catch(() => {
        feedback.textContent = "❌ Une erreur s'est produite.";
      })
      .finally(() => {
        submitBtn.disabled = false;
      });
    });
  </script>

</body>
</html>
